<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinyl for Spotify</title>
<style>
:root{--bg:#1b1410;--wood:#3a2618;--panel:#2a1c13;--text:#f2e6d5;--dim:#a8957d;--acc:#e8a33d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#33241a,var(--bg));color:var(--text);font-family:Georgia,serif;min-height:100vh;display:flex;justify-content:center;padding:20px}
.app{width:100%;max-width:440px}
h1{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);text-align:center;margin:0 0 14px;font-weight:normal}
.deck{position:relative;background:linear-gradient(145deg,#4a3120,var(--wood));border-radius:18px;padding:22px;box-shadow:0 20px 40px #0009,inset 0 1px #fff2}
.plate{position:relative;aspect-ratio:1;border-radius:50%;background:#0d0d0d;display:grid;place-items:center;box-shadow:inset 0 0 0 6px #222,0 0 0 4px #000}
.record{width:92%;aspect-ratio:1;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#191919 3px 4px);animation:spin 2.4s linear infinite;animation-play-state:paused}
.record.on{animation-play-state:running}
.record::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff0 0,#fff2 8%,#fff0 16%,#fff0 50%,#fff2 58%,#fff0 66%)}
.label{position:absolute;inset:32%;border-radius:50%;background:#c0392b center/cover;box-shadow:0 0 0 3px #0006}
.label::after{content:"";position:absolute;width:8%;height:8%;left:46%;top:46%;background:#0d0d0d;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;top:8px;right:14px;width:60px;height:60px;transform-origin:30px 30px;transition:transform .9s cubic-bezier(.4,0,.2,1);transform:rotate(-8deg);pointer-events:none}
.arm .base{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(#ddd,#777);box-shadow:0 2px 6px #000a}
.arm .bar{position:absolute;left:28px;top:30px;width:5px;height:250px;background:linear-gradient(90deg,#ccc,#888);border-radius:3px;box-shadow:2px 2px 4px #0008}
.arm .head{position:absolute;left:21px;top:272px;width:20px;height:34px;background:#222;border-radius:3px;transform:rotate(-6deg)}
.info{text-align:center;margin:18px 0 6px}
.title{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:var(--dim);font-size:14px;margin-top:2px}
.bar-w{height:8px;background:#0006;border-radius:4px;cursor:pointer;margin:14px 0 4px}
.bar-f{height:100%;width:0;background:var(--acc);border-radius:4px}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.ctl{display:flex;justify-content:center;gap:22px;margin-top:10px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid #fff2;border-radius:50%;width:48px;height:48px;font-size:18px;cursor:pointer}
button.big{width:60px;height:60px;background:var(--acc);color:#20140b;border:0}
.setup{background:var(--panel);border-radius:14px;padding:16px;margin-top:16px;font-size:13px;line-height:1.5;color:var(--dim)}
.setup input{width:100%;padding:10px;border-radius:8px;border:1px solid #fff3;background:#0004;color:var(--text);margin:8px 0;font:inherit}
.setup code{color:var(--acc);word-break:break-all}
.cta{width:100%;border-radius:10px;height:44px;background:var(--acc);color:#20140b;border:0;font-weight:bold}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px 0 8px;padding-bottom:6px}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--panel);border:1px solid #fff2;font-size:13px;cursor:pointer;color:var(--text)}
.chip.sel{background:var(--acc);color:#20140b}
.tracks{max-height:300px;overflow-y:auto}
.tr{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;font-size:14px}
.tr:hover,.tr.cur{background:#fff1}
.tr img{width:38px;height:38px;border-radius:4px;background:#000}
.tr span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr small{color:var(--dim)}
.hide{display:none}
#msg{text-align:center;font-size:12px;color:var(--dim);margin-top:10px;min-height:16px}
</style></head><body>
<div class="app">
<h1>Vinyl · Spotify</h1>
<div class="deck">
  <div class="plate"><div class="record" id="rec"><div class="label" id="lab"></div></div></div>
  <div class="arm" id="arm"><div class="base"></div><div class="bar"></div><div class="head"></div></div>
</div>
<div class="info"><div class="title" id="title">Nothing playing</div><div class="artist" id="artist">Connect Spotify to start</div></div>
<div class="bar-w" id="seek"><div class="bar-f" id="fill"></div></div>
<div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
<div class="ctl"><button id="prev">⏮</button><button class="big" id="pp">▶</button><button id="next">⏭</button></div>
<div id="msg"></div>

<div class="setup" id="setup">
  <b style="color:var(--text)">One-time setup</b><br>
  Create an app at developer.spotify.com/dashboard, add this Redirect URI:<br><code id="ru"></code>
  <input id="cid" placeholder="Paste your Spotify Client ID">
  <button class="cta" id="conn">Connect Spotify</button>
  <div style="margin-top:8px">Controls the Spotify app on this device. Needs Premium. Tick only Web API.</div>
</div>
<div id="lib" class="hide">
  <div class="chips" id="chips"></div>
  <div class="tracks" id="tracks"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const REDIR=location.origin+location.pathname;
const SCOPE='streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private';
const S=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
$('ru').textContent=REDIR; $('cid').value=S('cid')||'';
const msg=t=>$('msg').textContent=t||'';
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('');
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

$('conn').onclick=async()=>{
  const id=$('cid').value.trim(); if(!id){msg('Enter your Client ID');return}
  S('cid',id); const v=rnd(64); S('ver',v);
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',redirect_uri:REDIR,scope:SCOPE,code_challenge_method:'S256',code_challenge:ch});
};
async function tokenReq(p){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:S('cid'),...p})});
  const j=await r.json(); if(!j.access_token) throw new Error(j.error_description||'auth failed');
  S('tok',j.access_token); S('exp',Date.now()+j.expires_in*1000-60000); if(j.refresh_token)S('ref',j.refresh_token);
}
async function token(){
  if(Date.now()>+S('exp')) await tokenReq({grant_type:'refresh_token',refresh_token:S('ref')});
  return S('tok');
}
async function api(path,opt={}){
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}});
  if(r.status===204||r.status===202) return null;
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.error?.message||r.status); return j;
}

let device,player,pl,cur={pos:0,dur:0,t:0,paused:true},uris=[],ctx;
async function init(){
  const code=new URLSearchParams(location.search).get('code');
  if(code){
    try{await tokenReq({grant_type:'authorization_code',code,redirect_uri:REDIR,code_verifier:S('ver')})}catch(e){msg(e.message)}
    history.replaceState({},'',REDIR);
  }
  if(!S('ref')) return;
  $('setup').classList.add('hide'); $('lib').classList.remove('hide'); msg('Warming up the turntable…');
  poll(); setInterval(poll,1500);
  try{
    const d=await api('/me/playlists?limit=30'); pl=d.items.filter(Boolean);
    $('chips').innerHTML=''; pl.forEach((p,i)=>{const c=document.createElement('div');c.className='chip';c.textContent=p.name;c.onclick=()=>load(i,c);$('chips').appendChild(c)});
    if(pl[0]) load(0,$('chips').firstChild);
  }catch(e){msg(e.message)}
}
async function load(i,chip){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel')); chip.classList.add('sel');
  ctx=pl[i].uri; $('tracks').innerHTML='Loading…';
  try{
    const d=await api(`/playlists/${pl[i].id}/tracks?limit=50`);
    const items=d.items.map(x=>x.track).filter(t=>t&&t.uri&&!t.is_local); uris=items.map(t=>t.uri);
    $('tracks').innerHTML=''; items.forEach((t,n)=>{
      const r=document.createElement('div'); r.className='tr'; r.dataset.uri=t.uri;
      r.innerHTML=`<img src="${t.album.images.at(-1)?.url||''}"><div style="min-width:0"><span>${esc(t.name)}</span><small>${esc(t.artists.map(a=>a.name).join(', '))}</small></div>`;
      r.onclick=()=>play(n); $('tracks').appendChild(r);
    });
  }catch(e){$('tracks').innerHTML='';msg(e.message)}
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function play(n){
  try{
    const d=await api('/me/player/devices'); const dev=d.devices.find(x=>x.is_active)||d.devices[0];
    if(!dev){msg('Open the Spotify app on this iPad, play any song once, then try again');return}
    await api('/me/player/play?device_id='+dev.id,{method:'PUT',body:JSON.stringify({uris,offset:{position:n}})});
    setTimeout(poll,600);
  }catch(e){msg(e.message)}
}
async function poll(){
  try{
    const st=await api('/me/player');
    if(!st||!st.item){cur.paused=true;$('rec').classList.remove('on');$('pp').textContent='▶';msg('Open the Spotify app and play a song once to link it');return}
    render({paused:!st.is_playing,position:st.progress_ms,duration:st.item.duration_ms,track_window:{current_track:st.item}});
  }catch(e){msg(e.message)}
}
function render(st){
  const t=st.track_window.current_track; if(!t) return;
  $('title').textContent=t.name; $('artist').textContent=t.artists.map(a=>a.name).join(', ');
  $('lab').style.backgroundImage=`url(${t.album.images[0]?.url})`;
  cur={pos:st.position,dur:st.duration,t:Date.now(),paused:st.paused};
  $('rec').classList.toggle('on',!st.paused); $('pp').textContent=st.paused?'▶':'⏸';
  document.querySelectorAll('.tr').forEach(r=>r.classList.toggle('cur',r.dataset.uri===t.uri)); msg();
}
setInterval(()=>{
  if(!cur.dur){return}
  const p=Math.min(cur.dur,cur.pos+(cur.paused?0:Date.now()-cur.t));
  $('fill').style.width=(p/cur.dur*100)+'%'; $('tc').textContent=fmt(p); $('td').textContent=fmt(cur.dur);
  $('arm').style.transform=`rotate(${cur.paused?-8:14+p/cur.dur*16}deg)`;
},250);
const cmd=async(m,p)=>{try{await api(p,{method:m});setTimeout(poll,500)}catch(e){msg(e.message)}};
$('pp').onclick=()=>cmd('PUT',cur.paused?'/me/player/play':'/me/player/pause');
$('prev').onclick=()=>cmd('POST','/me/player/previous'); $('next').onclick=()=>cmd('POST','/me/player/next');
$('seek').onclick=e=>{if(!cur.dur)return;const r=$('seek').getBoundingClientRect();cmd('PUT','/me/player/seek?position_ms='+Math.floor((e.clientX-r.left)/r.width*cur.dur))};
init();
</script></body></html>
